aid: d1-capital
name: D1 Capital Partners
description: >-
  D1 Capital Partners is a New York City-based global investment firm founded in
  July 2018 by Daniel Sundheim, the former Chief Investment Officer of Viking
  Global Investors, who seeded the firm with more than $500 million of his own
  capital. The name "D1" references Amazon founder Jeff Bezos's "Day One"
  philosophy. D1 deploys capital across both public and private markets: in
  public markets it runs a global long/short equity strategy (including equity
  derivatives and convertible bonds) targeting medium- to long-term returns,
  while in private markets it takes later-stage, non-controlling growth-equity
  stakes in expanding companies. The firm's private portfolio spans consumer,
  business services, financial services, healthcare, industrials, real estate,
  and technology, media and telecommunications, with notable positions in
  companies such as SpaceX, Stripe, Anthropic, OpenAI, Ramp, Robinhood, GitLab,
  and Instacart. As a "Tiger Cub" descended from Viking Global, D1 grew from
  roughly $3 billion at launch to more than $20 billion by the end of 2020, and
  has been reported managing on the order of $24 billion in assets. It is
  headquartered at 9 West 57th Street in Manhattan.
